<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 花 大項目 - 絵文字スタイル -->
  <!-- currentColor = 投稿色 (flutter_svg colorFilter で差し替え) -->

  <!-- 6枚の花びら (60°ずつ回転) -->
  <g transform="translate(16,16)">
    <ellipse cx="0" cy="-9" rx="4" ry="6" fill="currentColor"/>
    <ellipse cx="0" cy="-9" rx="4" ry="6" fill="currentColor" transform="rotate(60)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="6" fill="currentColor" transform="rotate(120)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="6" fill="currentColor" transform="rotate(180)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="6" fill="currentColor" transform="rotate(240)"/>
    <ellipse cx="0" cy="-9" rx="4" ry="6" fill="currentColor" transform="rotate(300)"/>
    <!-- 中心 (黄色) -->
    <circle cx="0" cy="0" r="5" fill="#FFD700"/>
    <!-- 光沢 -->
    <circle cx="-1.5" cy="-1.5" r="1.5" fill="rgba(255,255,255,0.6)"/>
  </g>
</svg>
