<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 危険情報 大項目 - 絵文字スタイル -->
  <!-- 角丸三角形 + ビックリマーク -->

  <!-- 角丸三角形 (stroke-linejoin="round" で角を丸める) -->
