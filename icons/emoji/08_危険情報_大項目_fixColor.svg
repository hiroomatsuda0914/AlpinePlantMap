           fill="#FFC107"
           stroke="#FFC107"
           stroke-width="6"
           stroke-linejoin="round"/>

  <!-- ! マーク -->
  <!-- 縦棒 (角丸rect) -->
  <rect x="14.5" y="11" width="3" height="10" rx="1.5" fill="#5D2E0C"/>
  <!-- ドット -->
  <circle cx="16" cy="25" r="2" fill="#5D2E0C"/>
</svg>
