<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 危険情報 大項目 - ドット絵詳細版 -->
  <!-- 7段階ステップで傾斜を滑らかに + 左上ハイライト -->

  <!-- 三角形 (7段階ステップ) -->
  <rect x="14" y="0"  width="4"  height="2"  fill="#FF8C00"/>
  <rect x="12" y="2"  width="8"  height="2"  fill="#FF8C00"/>
  <rect x="10" y="4"  width="12" height="2"  fill="#FF8C00"/>
  <rect x="8"  y="6"  width="16" height="2"  fill="#FF8C00"/>
  <rect x="6"  y="8"  width="20" height="2"  fill="#FF8C00"/>
  <rect x="4"  y="10" width="24" height="2"  fill="#FF8C00"/>
  <rect x="2"  y="12" width="28" height="2"  fill="#FF8C00"/>

  <!-- 本体フラット部分 -->
  <rect x="2"  y="14" width="28" height="14" fill="#FF8C00"/>
  <!-- 底辺の角丸ぽい処理 -->
  <rect x="4"  y="28" width="24" height="2"  fill="#FF8C00"/>

  <!-- 左上ハイライト (立体感) -->
  <rect x="4"  y="14" width="6"  height="2"  fill="#FFD740"/>
  <rect x="4"  y="16" width="2"  height="4"  fill="#FFD740"/>

  <!-- ! マーク (濃い茶) -->
  <!-- 縦棒 -->
  <rect x="14" y="16" width="4"  height="6"  fill="#5D2E0C"/>
  <!-- gap 2px -->
  <!-- ドット -->
  <rect x="14" y="24" width="4"  height="4"  fill="#5D2E0C"/>
</svg>
