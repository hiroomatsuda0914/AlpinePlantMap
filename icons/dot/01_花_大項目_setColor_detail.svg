<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" style="color: #FF69B4;">
  <!-- 花 大項目 - ドット絵詳細版 (ドット数増加) -->
  <!-- ブラウザ確認用: style="color: #FF69B4" でピンク表示 / Flutter では colorFilter で上書き -->

  <!-- 上ペタル: 先端(2cell)→中間(6cell)→根元(8cell) と段階的に広がる -->
  <rect x="14" y="2"  width="4"  height="2"  fill="currentColor"/>
  <rect x="12" y="4"  width="8"  height="2"  fill="currentColor"/>
  <rect x="10" y="6"  width="12" height="4"  fill="currentColor"/>
  <rect x="8"  y="10" width="16" height="2"  fill="currentColor"/>

  <!-- 左ペタル: 先端(2rows)→根元(8rows) と縦幅が広がる -->
  <rect x="2"  y="14" width="2"  height="4"  fill="currentColor"/>
  <rect x="4"  y="12" width="2"  height="8"  fill="currentColor"/>
  <rect x="6"  y="12" width="2"  height="8"  fill="currentColor"/>
  <rect x="8"  y="12" width="4"  height="8"  fill="currentColor"/>

  <!-- 右ペタル -->
  <rect x="28" y="14" width="2"  height="4"  fill="currentColor"/>
  <rect x="26" y="12" width="2"  height="8"  fill="currentColor"/>
  <rect x="24" y="12" width="2"  height="8"  fill="currentColor"/>
  <rect x="20" y="12" width="4"  height="8"  fill="currentColor"/>

  <!-- 下ペタル: 根元(8cell)→先端(2cell) -->
  <rect x="8"  y="20" width="16" height="2"  fill="currentColor"/>
  <rect x="10" y="22" width="12" height="4"  fill="currentColor"/>
  <rect x="12" y="26" width="8"  height="2"  fill="currentColor"/>
  <rect x="14" y="28" width="4"  height="2"  fill="currentColor"/>

  <!-- 中心 (黄色) -->
  <rect x="12" y="12" width="8"  height="8"  fill="#FFD700"/>
  <!-- おしべ十字 (濃いオレンジ) -->
  <rect x="14" y="12" width="4"  height="2"  fill="#E65C00"/>
  <rect x="14" y="18" width="4"  height="2"  fill="#E65C00"/>
  <rect x="12" y="14" width="2"  height="4"  fill="#E65C00"/>
  <rect x="18" y="14" width="2"  height="4"  fill="#E65C00"/>
  <!-- 中心ドット -->
  <rect x="14" y="14" width="4"  height="4"  fill="#FF8C00"/>
</svg>
